
pool: devops-agent

trigger: none

variables:
  containerRegistry: 'heartfelt-acr'
  containerRegistryLoginServer: 'heartfeltacr12345.azurecr.io'
  imageRepository: 'heart-felt'
  imageTag: '$(Build.BuildId)'
  DockerfilePath: '**/Dockerfile'

  azureServiceConnection: 'devops-svc'
  azureResourceGroup: 'heartfelt-rg'
  kubernetesCluster: 'heartfelt-aks'

stages:

# ==========================================
# Stage 1: Build, Scan and Push
# ==========================================

- stage: BuildImage
  displayName: 'Build, Scan and Push Image'
  isSkippable: false

  jobs:

  - job: BuildScanPush
    displayName: 'Build and Security Scan'

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'

    # --------------------------------------
    # Login to ACR
    # --------------------------------------

    - task: Docker@2
      displayName: 'Login to ACR'
      inputs:
        containerRegistry: '$(containerRegistry)'
        command: 'login'

    # --------------------------------------
    # Build and Push Multi-Platform Image
    # --------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        $IMAGE = "$(containerRegistryLoginServer)/$(imageRepository):$(imageTag)"

        Write-Host "=========================================="
        Write-Host "Building multi-platform Docker image"
        Write-Host "$IMAGE"
        Write-Host "=========================================="

        docker buildx inspect --bootstrap

        docker buildx build `
          --platform linux/amd64,linux/arm64 `
          -f "$(Build.SourcesDirectory)/Dockerfile" `
          -t "$IMAGE" `
          --push `
          "$(Build.SourcesDirectory)"

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Multi-platform Docker build failed."
          exit $LASTEXITCODE
        }

        Write-Host "Multi-platform image build and push completed successfully."

      displayName: 'Build and Push Multi-Platform Docker Image'

    # --------------------------------------
    # Trivy Image Security Scan
    # --------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        $IMAGE = "$(containerRegistryLoginServer)/$(imageRepository):$(imageTag)"

        Write-Host "=========================================="
        Write-Host "Scanning Docker image:"
        Write-Host "$IMAGE"
        Write-Host "=========================================="

        trivy image `
          --scanners vuln,secret,license `
          --severity CRITICAL `
          --exit-code 1 `
          "$IMAGE"

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Trivy image scan failed."
          exit $LASTEXITCODE
        }

        Write-Host "Trivy image scan passed."

      displayName: 'Trivy Image Security Scan'

    # --------------------------------------
    # Trivy Kubernetes Configuration Scan
    # --------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Write-Host "=========================================="
        Write-Host "Scanning Kubernetes manifests"
        Write-Host "=========================================="

        trivy config `
          --severity CRITICAL `
          --exit-code 1 `
          "$(Build.SourcesDirectory)/manifest"

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Trivy configuration scan failed."
          exit $LASTEXITCODE
        }

        Write-Host "Trivy configuration scan passed."

      displayName: 'Trivy Configuration Scan'


# ==========================================
# Stage 2: Deploy to Dev + Smoke Test
# ==========================================

- stage: DeployToDev
  displayName: 'Deploy Dev and Test'

  dependsOn: BuildImage
  condition: succeeded()

  jobs:

  - deployment: DeployDev
    displayName: 'Deploy Application to Dev'

    environment: 'heartfelt-dev'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self
            displayName: 'Checkout Kubernetes Manifests'

          # --------------------------------
          # Deploy to AKS
          # --------------------------------

          - task: KubernetesManifest@1
            displayName: 'Deploy Application to AKS'
            inputs:
              action: 'deploy'
              connectionType: 'azureResourceManager'
              azureSubscriptionConnection: '$(azureServiceConnection)'
              azureResourceGroup: '$(azureResourceGroup)'
              kubernetesCluster: '$(kubernetesCluster)'
              manifests: |
                manifest/deployment.yaml
                manifest/service.yaml
              containers: |
                $(containerRegistryLoginServer)/$(imageRepository):$(imageTag)

          # --------------------------------
          # Verify Application Health
          # --------------------------------

          - powershell: |
              $ErrorActionPreference = "Stop"

              if ([string]::IsNullOrWhiteSpace($env:SMOKE_TEST_URL)) {
                Write-Error "SMOKE_TEST_URL is not configured."
                exit 1
              }

              Write-Host "Testing application endpoint:"
              Write-Host "$env:SMOKE_TEST_URL"

              for ($attempt = 1; $attempt -le 12; $attempt++) {

                try {
                  $response = Invoke-WebRequest `
                    -Uri $env:SMOKE_TEST_URL `
                    -UseBasicParsing `
                    -TimeoutSec 10

                  $HTTP_CODE = $response.StatusCode
                }
                catch {
                  $HTTP_CODE = "No Response"
                }

                if ($HTTP_CODE -eq 200) {
                  Write-Host "Smoke test passed. HTTP $HTTP_CODE"
                  exit 0
                }

                Write-Host "Attempt $attempt/12 failed. HTTP: $HTTP_CODE"

                Start-Sleep -Seconds 10
              }

              Write-Error "Application health check failed."
              exit 1

            displayName: 'Dev HTTP Smoke Test'

            env:
              SMOKE_TEST_URL: $(devSmokeTestUrl)


# ==========================================
# Stage 3: Deploy to Production
# ==========================================

- stage: DeployProd
  displayName: 'Deploy to Production'

  dependsOn: DeployToDev
  condition: succeeded()

  jobs:

  - deployment: DeployProd
    displayName: 'Deploy Application to Production'

    environment: 'heartfelt-prod'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self
            displayName: 'Checkout Kubernetes Manifests'

          # --------------------------------
          # Deploy to AKS Production
          # --------------------------------

          - task: KubernetesManifest@1
            displayName: 'Deploy Application to AKS'
            inputs:
              action: 'deploy'
              connectionType: 'azureResourceManager'
              azureSubscriptionConnection: '$(azureServiceConnection)'
              azureResourceGroup: '$(azureResourceGroup)'
              kubernetesCluster: '$(kubernetesCluster)'
              manifests: |
                manifest/deployment.yaml
                manifest/service.yaml
              containers: |
                $(containerRegistryLoginServer)/$(imageRepository):$(imageTag)